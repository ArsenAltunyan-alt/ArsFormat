{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій сайт{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- HEADER -->
<header class="bg-dark text-white py-3">
    <div class="container">
        <h1 class="mb-0">Мій Django-сайт</h1>
        <nav class="mt-2">
            <a href="" class="text-white me-3">Головна</a>
            <a href="" class="text-white me-3">Про нас</a>
            <a href="" class="text-white">Контакти</a>
        </nav>
    </div>
</header>

<main class="container my-4">
    {% block content %}
    {% endblock %}
</main>

<!-- FOOTER -->
<footer class="bg-light text-center py-3 mt-auto">
    <div class="container">
        <p class="mb-0">&copy; {{ year|default:"2025" }} Мій сайт. Всі права захищені.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
