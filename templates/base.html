{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій сайт{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<style>
    header.blur-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1030;
        transition: background-color 0.3s ease, backdrop-filter 0.3s ease;
        background-color: transparent;
    }

    header.scrolled {
        background-color: transparent;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .hero-section {
        min-height: 100vh;
        background-image: url("{% static 'img/background.jpg' %}");
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        position: relative;
        color: white;
    }

    .hero-overlay {
        background: rgba(0, 0, 0, 0.6);
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }

    .hero-content {
        position: relative;
        z-index: 2;
        padding-top: 60px;
        text-align: center;
    }
</style>

<!-- ХЕДЕР -->
<header class="blur-header py-4">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h5 mb-0">Мій сайт</h1>
        <nav>
            <a href="#" class="text-dark me-3">Продукти</a>
            <a href="#" class="text-dark me-3">Про нас</a>
            <a href="#" class="text-dark">Контакти</a>
        </nav>
    </div>
</header>

<!-- HERO -->
<div class="hero-section">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
        <main class="container my-4">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container">
        <p class="mb-0">&copy; {{ year|default:"2025" }} Мій сайт. Всі права захищені.</p>
    </div>
</footer>

<script>
    // Додає клас "scrolled" до хедера при прокрутці
    window.addEventListener('scroll', function () {
        const header = document.querySelector('header');
        if (window.scrollY > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
